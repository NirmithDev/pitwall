<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d12" />
    <script>
      // Apply the preference before rendering to avoid a flash of the wrong theme.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("pitwall.theme");
        } catch {}
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark"
            ? saved
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
      })();
    </script>
    <meta
      name="description"
      content="An independent historical motorsport replay lab. Explore race timing, tyre strategy, and the moments that mattered."
    />
    <title>Pitwall — Race Replay Lab</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d12'/%3E%3Cpath d='M15 44V20h21a9 9 0 0 1 0 18H24v6z' fill='%23ff4b3e'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
