name: Verify and deliver
on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pitwall-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pitwall
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: pitwall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pitwall -d pitwall"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test timing and interpolation
        run: npm test
        working-directory: frontend
      - name: Test historical catalog filtering
        run: node --test scripts/import-race.test.mjs
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Build API
        run: dotnet build backend/Pitwall.Api/Pitwall.Api.csproj -c Release
      - name: Test API against PostgreSQL, including restart persistence
        run: python scripts/test-api.py --postgres
        env:
          ConnectionStrings__Pitwall: Host=127.0.0.1;Port=5432;Database=pitwall;Username=pitwall;Password=ci-test-password
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify replay interactions in browser
        run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
  container:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image; publish trusted release branch builds
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
